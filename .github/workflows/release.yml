# Release trains (BL-017 + BL-031): each app has its own tag family and train.
# Release Please (release-please.yml) opens a per-component release PR; merging one
# creates its tag, which fires exactly that component's train here:
#
#   extension-v*    gate + build -> GitHub Release (extension zip + channel zip)
#                   -> Chrome Web Store (BL-019) + update channel (BL-020)
#   bookmarklet-v*  gate + build -> GitHub Release (install.html + bookmarklet.txt)
#                   -> GitHub Pages (BL-018)
#   action-v*       gate + build -> GitHub Release -> move the floating action-vN alias
#
# The full monorepo quality gate runs on every train (cheap safety). Each train's
# version guard compares the tag against that component's own version source, so a
# stray hand-pushed tag still fails safely.
name: Release

on:
  push:
    tags:
      - 'extension-v*'
      - 'bookmarklet-v*'
      - 'action-v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # ── extension train ─────────────────────────────────────────────────────────
  release-extension:
    name: Release extension
    if: startsWith(github.ref_name, 'extension-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches public/manifest.json
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#extension-v}"
          MANIFEST_VERSION=$(jq -r .version apps/extension/public/manifest.json)
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match apps/extension/public/manifest.json (version ${MANIFEST_VERSION})."
            exit 1
          fi
          echo "Releasing extension ${MANIFEST_VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check (Biome)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

      # Extension zip (without the channel — not part of the extension package)
      # plus the channel pair zipped so the manifest/bundle pairing stays intact.
      - name: Package extension artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#extension-v}"
          STAGING="$GITHUB_WORKSPACE/dist-release"
          mkdir -p "$STAGING"
          (cd apps/extension/dist && zip -r "$STAGING/triage-extension-v${VERSION}.zip" . -x "channel/*")
          (cd apps/extension/dist/channel && zip -r "$STAGING/triage-channel-v${VERSION}.zip" .)
          ls -l "$STAGING"

      # Idempotent: Release Please already created the GitHub Release (notes) when
      # its release PR merged, so attach the built assets to it. Only create the
      # release if it's somehow missing (e.g. a re-run before Release Please ran).
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#extension-v}"
          ASSETS=(
            "dist-release/triage-extension-v${VERSION}.zip"
            "dist-release/triage-channel-v${VERSION}.zip"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Extension $GITHUB_REF_NAME" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

  # BL-019: upload the released extension zip to the Chrome Web Store and submit it
  # for review — the store is the extension's real update path (MVP.md §5.3). Gated
  # on the CWS_EXTENSION_ID repo VARIABLE (secrets are not readable in a job-level
  # `if`), so it skips cleanly until the one-time Web Store bootstrap is done. The
  # job's contract ends at "submitted"; store review latency is external.
  webstore:
    name: Publish extension to Chrome Web Store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release-extension
    if: ${{ vars.CWS_EXTENSION_ID != '' }}
    permissions:
      contents: read
    steps:
      - name: Download the released extension zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "triage-extension-*.zip" --output extension.zip

      - name: Upload & submit for review
        env:
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for v in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set, but CWS_EXTENSION_ID is configured so publishing was expected. Add the secret or unset the variable."
              exit 1
            fi
          done

          TOKEN=$(curl -s https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" \
            -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not obtain a Chrome Web Store access token (check the CWS_* credentials)."
            exit 1
          fi

          UPLOAD=$(curl -s -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}" \
            -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" \
            -T extension.zip)
          echo "upload response: $UPLOAD"
          if [ "$(echo "$UPLOAD" | jq -r '.uploadState // empty')" != "SUCCESS" ]; then
            echo "::error::Chrome Web Store upload failed — response above names the store's reason."
            exit 1
          fi

          PUBLISH=$(curl -s -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}/publish" \
            -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" \
            -H "Content-Length: 0")
          echo "publish response: $PUBLISH"
          STATUS=$(echo "$PUBLISH" | jq -r '.status[0] // empty')
          case "$STATUS" in
            OK|ITEM_PENDING_REVIEW) echo "Submitted for review (status: $STATUS)." ;;
            *)
              echo "::error::Chrome Web Store publish failed — response above names the store's reason."
              exit 1
              ;;
          esac

  # BL-020: publish dist/channel/ to the static host with the validated cache
  # policy (manifest.json → no-store, hashed bundle → immutable). Bundle uploaded
  # BEFORE the manifest so a reader never sees a manifest naming a missing bundle.
  # Gated on the CHANNEL_BUCKET repo variable. Never wired to the github.com
  # bookmarklet.
  channel:
    name: Publish update channel (static host)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release-extension
    if: ${{ vars.CHANNEL_BUCKET != '' }}
    permissions:
      contents: read
    steps:
      - name: Download the released channel pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "triage-channel-*.zip" --output channel.zip
          mkdir -p channel
          unzip channel.zip -d channel
          ls -l channel

      - name: Upload bundle first, manifest last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CHANNEL_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CHANNEL_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.CHANNEL_REGION || 'us-east-1' }}
          CHANNEL_BUCKET: ${{ vars.CHANNEL_BUCKET }}
          CHANNEL_PREFIX: ${{ vars.CHANNEL_PREFIX || 'triage' }}
          CHANNEL_ENDPOINT_URL: ${{ vars.CHANNEL_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::CHANNEL_${v#AWS_} is not set, but CHANNEL_BUCKET is configured so publishing was expected. Add the secret or unset the variable."
              exit 1
            fi
          done

          ENDPOINT_ARGS=()
          if [ -n "${CHANNEL_ENDPOINT_URL:-}" ]; then
            ENDPOINT_ARGS=(--endpoint-url "$CHANNEL_ENDPOINT_URL")
          fi
          DEST="s3://${CHANNEL_BUCKET}/${CHANNEL_PREFIX}"

          BUNDLE=$(ls channel/triage-*.js)
          # Values mirror BUNDLE_CACHE_CONTROL / MANIFEST_CACHE_CONTROL in
          # apps/extension/src/update-channel/channel.ts — keep them in sync.
          aws s3 cp "$BUNDLE" "$DEST/$(basename "$BUNDLE")" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/javascript" "${ENDPOINT_ARGS[@]}"
          aws s3 cp channel/manifest.json "$DEST/manifest.json" \
            --cache-control "no-store" \
            --content-type "application/json" "${ENDPOINT_ARGS[@]}"

      - name: Verify live channel headers
        if: ${{ vars.CHANNEL_PUBLIC_URL != '' }}
        env:
          CHANNEL_PUBLIC_URL: ${{ vars.CHANNEL_PUBLIC_URL }}
        run: |
          set -euo pipefail
          BASE="${CHANNEL_PUBLIC_URL%/}"
          MANIFEST_HEADERS=$(curl -sS -D - -o manifest.json "$BASE/manifest.json")
          echo "$MANIFEST_HEADERS"
          echo "$MANIFEST_HEADERS" | grep -i "cache-control" | grep -qi "no-store" \
            || { echo "::error::manifest.json is not served with Cache-Control: no-store"; exit 1; }
          BUNDLE_NAME=$(jq -r .bundle manifest.json)
          BUNDLE_HEADERS=$(curl -sS -I "$BASE/$BUNDLE_NAME")
          echo "$BUNDLE_HEADERS"
          echo "$BUNDLE_HEADERS" | grep -i "cache-control" | grep -qi "immutable" \
            || { echo "::error::$BUNDLE_NAME is not served with the immutable cache policy"; exit 1; }

  # ── bookmarklet train ───────────────────────────────────────────────────────
  release-bookmarklet:
    name: Release bookmarklet
    if: startsWith(github.ref_name, 'bookmarklet-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches src/version.ts
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#bookmarklet-v}"
          SRC_VERSION=$(sed -nE "s/.*BOOKMARKLET_VERSION = '([^']+)'.*/\1/p" apps/bookmarklet/src/version.ts)
          if [ "$TAG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match apps/bookmarklet/src/version.ts (version ${SRC_VERSION})."
            exit 1
          fi
          echo "Releasing bookmarklet ${SRC_VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check (Biome)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

      - name: Package bookmarklet artifacts
        run: |
          set -euo pipefail
          STAGING="$GITHUB_WORKSPACE/dist-release"
          mkdir -p "$STAGING"
          cp apps/bookmarklet/dist/install.html "$STAGING/install.html"
          cp apps/bookmarklet/dist/bookmarklet.txt "$STAGING/bookmarklet.txt"
          ls -l "$STAGING"

      # Idempotent: attach the built assets to the release Release Please already
      # created; only create it if it's missing (see the extension train note).
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(
            "dist-release/install.html"
            "dist-release/bookmarklet.txt"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Bookmarklet $GITHUB_REF_NAME" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

  # BL-018: publish the bookmarklet install page to GitHub Pages — one canonical
  # URL always serves the latest build; re-installing from it IS the bookmarklet's
  # update story (MVP.md §5.1). The page is self-contained (BL-013); never a remote
  # loader for github.com (MVP.md §5.2).
  pages:
    name: Deploy bookmarklet install page (Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release-bookmarklet
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build bookmarklet
        run: pnpm --filter @triage/bookmarklet build

      - name: Stage Pages site
        run: |
          set -euo pipefail
          mkdir -p pages-site
          cp apps/bookmarklet/dist/install.html pages-site/index.html
          cp apps/bookmarklet/dist/bookmarklet.txt pages-site/bookmarklet.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ── action train ────────────────────────────────────────────────────────────
  release-action:
    name: Release action
    if: startsWith(github.ref_name, 'action-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches apps/action/package.json
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#action-v}"
          PKG_VERSION=$(jq -r .version apps/action/package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match apps/action/package.json (version ${PKG_VERSION})."
            exit 1
          fi
          echo "Releasing action ${PKG_VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check (Biome)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

      # Idempotent: the action train ships no assets, so if Release Please already
      # created the release there is nothing to do; only create it if it's missing.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — nothing to upload."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Action $GITHUB_REF_NAME" \
              --generate-notes
          fi

      # Consumers pin `uses: …/apps/action@action-vN` — move that floating major
      # alias to this release so they track the latest action-vN.*. Pushed with the
      # default token, which does NOT re-trigger this workflow (no release loop).
      # HUSKY=0 disables the repo's git hooks: `pnpm install` above installs husky,
      # so this `git push` would otherwise fire the dev `.husky/pre-push` hook, which
      # runs `turbo …[origin/main]` and fails in the shallow, detached tag checkout
      # (no origin/main, no HEAD^). CI already runs the full suite; the hook is a
      # local-only guard.
      - name: Move floating major alias
        env:
          HUSKY: '0'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#action-v}"
          MAJOR="action-v${VERSION%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push origin -f "refs/tags/$MAJOR"
          echo "Moved floating alias ${MAJOR} → ${GITHUB_REF_NAME}"
