# Release (BL-017): pushing a version tag is the ONLY release action — everything
# downstream is automatic. The tag must match apps/extension/public/manifest.json
# (the single version source), the full quality gate must pass, and the built
# artifacts are attached to a GitHub Release. Per-surface deploys (BL-018 Pages,
# BL-019 Web Store, BL-020 update channel) chain off this workflow as later jobs.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Gate, package & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail loudly BEFORE building anything: a tag that does not match the
      # manifest version must never publish a half-versioned release.
      - name: Verify tag matches public/manifest.json
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(jq -r .version apps/extension/public/manifest.json)
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match apps/extension/public/manifest.json (version ${MANIFEST_VERSION}). Bump the manifest (the single version source) and re-tag."
            exit 1
          fi
          echo "Releasing version ${MANIFEST_VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A release never skips the gate — same four commands as CI's verify job.
      - name: Lint & format check (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Four artifact groups: extension zip (without the channel — that is not
      # part of the extension package), the bookmarklet install page + URL, and
      # the channel pair zipped so the manifest/bundle pairing stays intact.
      - name: Package release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="$GITHUB_WORKSPACE/dist-release"
          mkdir -p "$STAGING"

          (cd apps/extension/dist && zip -r "$STAGING/triage-extension-v${VERSION}.zip" . -x "channel/*")
          (cd apps/extension/dist/channel && zip -r "$STAGING/triage-channel-v${VERSION}.zip" .)
          cp apps/bookmarklet/dist/install.html "$STAGING/install.html"
          cp apps/bookmarklet/dist/bookmarklet.txt "$STAGING/bookmarklet.txt"

          ls -l "$STAGING"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Triage $GITHUB_REF_NAME" \
            --generate-notes \
            "dist-release/triage-extension-${GITHUB_REF_NAME}.zip" \
            "dist-release/triage-channel-${GITHUB_REF_NAME}.zip" \
            "dist-release/install.html" \
            "dist-release/bookmarklet.txt"

  # BL-018: publish the bookmarklet install page to GitHub Pages on every
  # release, so one canonical URL always serves the latest build — re-installing
  # from that page IS the bookmarklet's update story (MVP.md §5.1). The page is
  # fully self-contained (BL-013); this is never a remote loader for github.com
  # (MVP.md §5.2). Runs only after the release job's version guard + gate passed.
  pages:
    name: Deploy bookmarklet install page (Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bookmarklet
        run: pnpm --filter @triage/bookmarklet build

      # The install page becomes the site root; bookmarklet.txt rides along for
      # anyone who wants the raw javascript: URL.
      - name: Stage Pages site
        run: |
          set -euo pipefail
          mkdir -p pages-site
          cp apps/bookmarklet/dist/install.html pages-site/index.html
          cp apps/bookmarklet/dist/bookmarklet.txt pages-site/bookmarklet.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # BL-019: upload the released extension zip to the Chrome Web Store and submit
  # it for review — the store is the extension's real update path (MVP.md §5.3).
  # Gated on the CWS_EXTENSION_ID repo VARIABLE (same dormancy pattern as Sonar's
  # SONAR_ORGANIZATION: secrets are not readable in a job-level `if`), so the job
  # skips cleanly until the one-time Web Store bootstrap is done: developer
  # account, first manual listing, OAuth client + refresh token, then set the
  # CWS_EXTENSION_ID variable and CWS_CLIENT_ID / CWS_CLIENT_SECRET /
  # CWS_REFRESH_TOKEN secrets. Publishes the exact zip attached to the GitHub
  # Release — never a separate rebuild. The job's contract ends at "submitted";
  # store review latency is external.
  webstore:
    name: Publish extension to Chrome Web Store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    if: ${{ vars.CWS_EXTENSION_ID != '' }}
    permissions:
      contents: read
    steps:
      - name: Download the released extension zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "triage-extension-*.zip" --output extension.zip

      - name: Upload & submit for review
        env:
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for v in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set, but CWS_EXTENSION_ID is configured so publishing was expected. Add the secret or unset the variable."
              exit 1
            fi
          done

          TOKEN=$(curl -s https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" \
            -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not obtain a Chrome Web Store access token (check the CWS_* credentials)."
            exit 1
          fi

          UPLOAD=$(curl -s -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}" \
            -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" \
            -T extension.zip)
          echo "upload response: $UPLOAD"
          if [ "$(echo "$UPLOAD" | jq -r '.uploadState // empty')" != "SUCCESS" ]; then
            echo "::error::Chrome Web Store upload failed — response above names the store's reason."
            exit 1
          fi

          PUBLISH=$(curl -s -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}/publish" \
            -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" \
            -H "Content-Length: 0")
          echo "publish response: $PUBLISH"
          STATUS=$(echo "$PUBLISH" | jq -r '.status[0] // empty')
          case "$STATUS" in
            OK|ITEM_PENDING_REVIEW) echo "Submitted for review (status: $STATUS)." ;;
            *)
              echo "::error::Chrome Web Store publish failed — response above names the store's reason."
              exit 1
              ;;
          esac
